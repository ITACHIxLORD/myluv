<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050505;
            color: #ff1744;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: monospace;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        pre {
            font-size: 10px;
            line-height: 10px;
            white-space: pre;
            color: #ff1744;
            text-shadow: 0 0 8px #ff1744,
                         0 0 20px #ff1744;
        }

        h2 {
            margin-top: 30px;
            color: pink;
            letter-spacing: 3px;
            text-shadow: 0 0 12px hotpink;
        }
    </style>
</head>

<body>

    <div class="container">
        <pre id="heart"></pre>
        <h2>I LOVE YOU ❤️</h2>
    </div>

    <script src="script.js"></script>

</html>
